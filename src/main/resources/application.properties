spring.application.name=auth-service
server.port=8082

# JWT – change this secret before going to production
jwt.secret=dGhpcyBpcyBhIHNlY3JldCBrZXkgZm9yIGp3dCBzaWduaW5n
# Access token: 15 minutes
jwt.access-expiration=900000
# Refresh token: 7 days
jwt.refresh-expiration=604800000

# H2 in-memory DB for refresh token storage
spring.datasource.url=jdbc:h2:mem:authdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Account service base URL
account.service.url=http://localhost:8081

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=auth-service

# ── Resilience4j Circuit Breaker ──────────────────────────────────────────────
# Count-based sliding window of 10 calls
resilience4j.circuitbreaker.instances.account-service.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.account-service.sliding-window-size=10

# Open the circuit when 50% of calls fail
resilience4j.circuitbreaker.instances.account-service.failure-rate-threshold=50

# Minimum calls before failure rate is evaluated
resilience4j.circuitbreaker.instances.account-service.minimum-number-of-calls=5

# Stay OPEN for 10 seconds, then try 3 calls in HALF-OPEN state
resilience4j.circuitbreaker.instances.account-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.account-service.permitted-number-of-calls-in-half-open-state=3

# 401 is a business error — don't count it as a circuit failure
resilience4j.circuitbreaker.instances.account-service.ignore-exceptions=org.springframework.web.server.ResponseStatusException
